apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: media
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/hostname: k3s-server-01
      containers:
        - name: gluetun
          image: qmcgaw/gluetun@sha256:b0ee2135e6ba52ad3f102aae9663707cd1c9531485117067a380d3b2b6dd991d
          env:
            - name: VPN_SERVICE_PROVIDER
              value: protonvpn
            - name: VPN_TYPE
              value: wireguard
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: protonvpn-secrets
                  key: wireguard_private_key
            - name: SERVER_COUNTRIES
              value: United States
            - name: PORT_FORWARD_ONLY
              value: "on"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: DNS_UPSTREAM_RESOLVER_TYPE
              value: doh
            - name: HEALTH_TARGET_ADDRESSES
              value: 1.1.1.1:443,8.8.8.8:443
            - name: QBITTORRENT_WEBUI_USERNAME
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-webui-secrets
                  key: username
            - name: QBITTORRENT_WEBUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: qbittorrent-webui-secrets
                  key: password
            - name: VPN_PORT_FORWARDING_UP_COMMAND
              value: >-
                /bin/sh -c 'rm -f /tmp/qbittorrent-cookies && wget -qO- --retry-connrefused --save-cookies /tmp/qbittorrent-cookies --keep-session-cookies --post-data "username=${QBITTORRENT_WEBUI_USERNAME}&password=${QBITTORRENT_WEBUI_PASSWORD}" http://127.0.0.1:8080/api/v2/auth/login && wget -qO- --load-cookies /tmp/qbittorrent-cookies --post-data "json={\"listen_port\":{{PORT}},\"current_network_interface\":\"{{VPN_INTERFACE}}\",\"random_port\":false,\"upnp\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences'
            - name: VPN_PORT_FORWARDING_DOWN_COMMAND
              value: >-
                /bin/sh -c 'rm -f /tmp/qbittorrent-cookies && wget -qO- --retry-connrefused --save-cookies /tmp/qbittorrent-cookies --keep-session-cookies --post-data "username=${QBITTORRENT_WEBUI_USERNAME}&password=${QBITTORRENT_WEBUI_PASSWORD}" http://127.0.0.1:8080/api/v2/auth/login && wget -qO- --load-cookies /tmp/qbittorrent-cookies --post-data "json={\"listen_port\":0,\"current_network_interface\":\"lo\"}" http://127.0.0.1:8080/api/v2/app/setPreferences'
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: dev-net-tun
              mountPath: /dev/net/tun
            - name: gluetun-tmp
              mountPath: /tmp/gluetun
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent@sha256:065792d2b11f0facff340210fc1cf13623b029a94ecdf08b02d06d922205f618
          command:
            - /bin/sh
            - -c
          args:
            - |
              until [ -d /sys/class/net/tun0 ]; do
                echo "waiting for VPN interface tun0"
                sleep 2
              done
              exec /init
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Los_Angeles
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: webui
              containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1500m"
              memory: "2048Mi"
          readinessProbe:
            tcpSocket:
              port: webui
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: webui
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: qbit-config
              mountPath: /config
            - name: media-volume
              mountPath: /data
      volumes:
        - name: qbit-config
          persistentVolumeClaim:
            claimName: qbit-config-pvc-lp
        - name: media-volume
          persistentVolumeClaim:
            claimName: media-pvc
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        - name: gluetun-tmp
          emptyDir: {}
